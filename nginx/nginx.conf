upstream frappe_backend {
    server frappe-backend:8000;
}

upstream frappe_socketio {
    server frappe-backend:9000;
}

server {
    listen 80;
    server_name lusail.edu.qa www.lusail.edu.qa localhost;

    client_max_body_size 100M;

    location ^~ /assets/ {
        alias /var/www/html/sites/assets/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location ~ ^/protected/(.*) {
        internal;
        alias /var/www/html/sites/$1;
    }

    location /socket.io {
        proxy_pass http://frappe_socketio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frappe_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
